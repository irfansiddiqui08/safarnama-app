# Supabase project settings used by `supabase functions deploy`
[functions.video-url]
verify_jwt = true

[functions.bunny-upload]
verify_jwt = true

# Razorpay calls this one directly, so it checks Razorpay's own signature instead of a login.
[functions.razorpay-webhook]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.send-push]
verify_jwt = true

[functions.create-order]
# Public: anyone on the website can start a checkout. Price comes from the database.
verify_jwt = false

[functions.shop-order]
# Public: Sarava Parihaara website cart checkout. Prices are fixed inside the function.
verify_jwt = false

[functions.shop-webhook]
# Razorpay webhook of the separate Sarava Parihaara account: emails each paid shop order.
verify_jwt = false
